    # ══════════════════════════════════════════════════════════════
    # 客户端更新通道（仅对 LianYu 客户端开放，端到端加密）
    #   /api/update/check  —— 密钥 + 签名白名单校验后转发本地更新服务
    #   /dl/*.apk          —— nginx secure_link 短时签名下载，杜绝盗链刷量
    # ══════════════════════════════════════════════════════════════

    # ── 版本清单接口：密钥校验 + secure_link 白名单（仅 /api/update/check 可被签名） ──
    location = /api/update/check {
        set $lianyu_client_ok "";

        # 客户端密钥（内嵌于 APK，与本地服务做双重校验）
        if ($http_x_lianyu_key = "__APP_KEY__") {
            set $lianyu_client_ok "1";
        }
        if ($lianyu_client_ok != "1") {
            return 403;
        }

        # 签名清单：只有被签名的 URI 才会放行，且必须通过密钥校验
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "__SIG_PREFIX__|$secure_link_expires|$uri|__HMAC_SECRET__";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        proxy_pass http://127.0.0.1:3010/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LianYu-Key $http_x_lianyu_key;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── /api/update/ 下其余路径一律拒绝（隐藏扩展面） ──
    location ^~ /api/update/ {
        return 404;
    }

    # ── APK 签名下载：secure_link 校验通过才可下载 ──
    # 不设限速、不校验 referer（速度优先），仅限制单 IP 并发连接数
    location ^~ /dl/ {
        set $dl_secret "__DL_SECRET__";
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri$dl_secret";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        alias /root/lianyu-update/apk/;
        add_header Accept-Ranges bytes;
        add_header Content-Disposition attachment;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_conn perip 4;
    }

